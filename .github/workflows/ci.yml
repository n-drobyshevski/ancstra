name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Test (with coverage)
        run: pnpm turbo test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/web/coverage/lcov.info
            apps/web/coverage/coverage-summary.json
            packages/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          for f in apps/web/coverage/coverage-summary.json packages/*/coverage/coverage-summary.json; do
            if [ -f "$f" ]; then
              node -e "const j=require('./'+process.argv[1]); const parts=process.argv[1].split('/'); const pkg=parts.slice(0,-2).join('/'); console.log('- '+pkg+': lines '+j.total.lines.pct+'% | branches '+j.total.branches.pct+'% | functions '+j.total.functions.pct+'%')" "$f" >> $GITHUB_STEP_SUMMARY || true
            fi
          done

      - name: Build
        run: pnpm turbo build

  e2e:
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd tests && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd tests && npx playwright test
        env:
          AUTH_SECRET: test-secret-for-ci
          AUTH_TRUST_HOST: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
