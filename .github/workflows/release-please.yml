name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  back-sync:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      BRANCH: sync/main-to-dev-v${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Skip if dev already contains main's tip
        id: drift
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          if git merge-base --is-ancestor HEAD refs/remotes/origin/dev; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dev already contains main; no back-sync needed for v$VERSION"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a back-sync PR is already open
        if: steps.drift.outputs.skip == 'false'
        id: existing
        run: |
          n=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$n already open for $BRANCH"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch (= main's tip)
        if: steps.drift.outputs.skip == 'false' && steps.existing.outputs.skip == 'false'
        run: |
          git switch -c "$BRANCH"
          git push origin "$BRANCH"

      - name: Open PR and arm auto-merge (merge-commit only)
        if: steps.drift.outputs.skip == 'false' && steps.existing.outputs.skip == 'false'
        run: |
          url=$(gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore: back-sync main into dev (v$VERSION)" \
            --body "Automated back-sync after release-please cut \`v$VERSION\` on main.

          - Brings \`v$VERSION\` tag into dev's ancestry
          - Trees expected to match; merge introduces zero file changes
          - Merge method: **merge commit** (auto-merge armed) — squash/rebase would discard tag reachability

          🤖 Automated by .github/workflows/release-please.yml")
          gh pr merge "$url" --merge --auto
